# CloakMesh 白标配置（上游 WhiteLabeling.md 定义的机制）
# id:  应用标识（应用商店里必须唯一）
# org: 本地变体名，用于生成构建任务与产物名（不能含 . / 空格）
# resourceDir: 资源覆盖目录。注意：相对路径是按 app 模块目录解析的，
#              所以这里写 src/cloakmesh/res（即 app/src/cloakmesh/res）。
#              历史上把它写成仓库根相对路径会导致资源不参与合并，表现为
#              R.string.<新增串> unresolved、图标/翻译不生效。
id=com.cloakmesh.mobile
org=cloakmesh
resourceDir=src/cloakmesh/res
