name: build-android

# 用途：在没有本地 Android 工具链的机器上产出白标 APK。
# 产出：workflow artifact "cloakmesh-debug-apk"（保留 14 天），也可在 Release 时自动附到 release。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 直接用 runner 预装的 SDK：android-actions/setup-android@v3 会尝试安装已下架的
      # "tools" 包而失败（Failed to find package 'tools'），这里不再依赖该 action。
      - name: Install SDK components
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            'platforms;android-37.0' \
            'build-tools;37.0.0' \
            'ndk;30.0.16248370' \
            'cmake;4.1.2'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      # vcpkg 构建 libsodium 需要宿主的 autoconf/automake/libtool（runner 未预装齐全）
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf autoconf-archive automake libtool pkg-config build-essential \
            ninja-build curl zip unzip tar

      # runner 预装的 /usr/local/share/vcpkg 是裁剪副本，缺少 tunnel/vcpkg.json 里
      # builtin-baseline 指定的提交（20ceb8ad…），会报 "failed to git show versions/baseline.json"。
      # 这里自建一份完整克隆，确保基线提交可用。
      - name: Prepare vcpkg (full clone)
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vcpkg/vcpkg" version

      - name: Build white-label debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon -Pcmake.version=4.1.2 assembleCloakmeshDebug

      - name: Collect APK
        run: |
          mkdir -p out
          find . -name '*.apk' -path '*cloakmesh*' -exec cp {} out/ \;
          ls -lh out
          sha256sum out/*.apk > out/SHA256SUMS.txt || shasum -a 256 out/*.apk > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cloakmesh-debug-apk
          path: out/
          if-no-files-found: error